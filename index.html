<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestro - Hand Gesture Video Control</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div id="video-container">
            <div id="player"></div>
        </div>

        <div id="side-panel">
            <div id="webcam-container">
                <video id="webcam" playsinline></video>
                <canvas id="output" width="320" height="240"></canvas>
                <div id="status-badge" class="no-hand">
                    <span class="status-dot"></span>
                    <span id="status-text">No hand detected</span>
                </div>
            </div>

            <div id="volume-panel">
                <div id="volume-label">Volume</div>
                <div id="volume-row">
                    <div id="level-bar">
                        <div id="level-fill"></div>
                    </div>
                    <div id="volume-value-wrap">
                        <span id="volume-value">50</span>
                        <span id="volume-pct">%</span>
                    </div>
                </div>
            </div>

            <div id="sensitivity-panel">
                <div class="sensitivity-header">
                    <span class="sensitivity-title">Gesture Sensitivity</span>
                    <button id="sensitivity-reset">Reset</button>
                </div>
                <div class="slider-row">
                    <label for="flick-slider">
                        <span>Flick speed</span>
                        <span id="flick-value" class="slider-readout">5</span>
                    </label>
                    <input type="range" id="flick-slider" min="1" max="10" step="1" value="5">
                </div>
                <div class="slider-row">
                    <label for="ramp-slider">
                        <span>Ramp rate</span>
                        <span id="ramp-value" class="slider-readout">5</span>
                    </label>
                    <input type="range" id="ramp-slider" min="1" max="10" step="1" value="5">
                </div>
            </div>

            <div id="controls">
                <input type="text" id="youtube-url" placeholder="Paste YouTube URL...">
                <button id="load-video-btn">Load</button>
            </div>
        </div>

        <div id="overlay">
            <div class="overlay-content">
                <div class="logo-wrap">
                    <span class="logo-icon">&#9836;</span>
                    <h1>Maestro</h1>
                </div>
                <p>Control video playback with hand gestures</p>
                <div class="instructions">
                    <div class="instruction-item">
                        <span class="instruction-icon">&#8597;</span>
                        <span><strong>Move hand up/down</strong> — Control volume</span>
                    </div>
                    <div class="instruction-item">
                        <span class="instruction-icon">&#9995;</span>
                        <span><strong>Pinch gesture</strong> — Play / Pause</span>
                    </div>
                </div>
                <button id="start-btn">Start Maestro</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script src="js/youtube.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/mediapipe.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
